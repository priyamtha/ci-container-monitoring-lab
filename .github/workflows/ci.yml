name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Install and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  docker-build:
    name: Build and smoke-test image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ci-container-monitoring-lab:ci .

      - name: Start container
        run: docker run -d --name app -e MAINTENANCE_MODE=off -p 8080:3000 ci-container-monitoring-lab:ci

      - name: Wait for the service
        run: |
          for i in $(seq 1 15); do
            if curl -fs http://localhost:8080/health; then
              echo "service is up"
              exit 0
            fi
            sleep 2
          done
          echo "service did not become healthy"
          docker logs app
          exit 1

      - name: Check metrics endpoint
        run: curl -fs http://localhost:8080/metrics | grep http_requests_total
